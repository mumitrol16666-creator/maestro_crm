name: maestro-crm-qa

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: maestro_qa
      POSTGRES_PASSWORD: maestro_qa_password
      POSTGRES_DB: maestro_crm_regression
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - maestro_crm_qa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro_qa -d maestro_crm_regression"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: maestro-crm-qa-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile.learning-local
    command: sh -c "npx prisma db push --config=prisma.learning-local.config.ts && node src/server.js"
    environment:
      PORT: 5000
      NODE_ENV: development
      TZ: Asia/Aqtobe
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://maestro_qa:maestro_qa_password@db:5432/maestro_crm_regression?schema=public
      JWT_SECRET: qa-maestro-crm-jwt-secret
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://127.0.0.1:8081
      INTEGRATION_SERVICE_SECRET: local-maestro-integration-secret
      LEARNING_PLATFORM_API_URL: http://host.docker.internal:4001
      MAESTRO_QA_LOCAL: "true"
      MAESTRO_QA_DB_MARKER: maestro-crm-regression
      MAESTRO_QA_CONTROLLER_SECRET: local-maestro-qa-controller-2026
    ports:
      - "127.0.0.1:5002:5000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/prisma:/app/prisma:ro
      - ./backend/prisma.learning-local.config.ts:/app/prisma.learning-local.config.ts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    image: maestro-crm-qa-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.frontend.local
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  maestro_crm_qa_pg_data:
