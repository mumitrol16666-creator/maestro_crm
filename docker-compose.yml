services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maestro-crm-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/sessions:/app/sessions
    depends_on:
      - redis
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: maestro-crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: maestro-crm-redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: maestro-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
