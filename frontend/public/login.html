<!DOCTYPE html>
<html lang="ru" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="description" content="Вход в панель школы — Музыкальная школа Maestro">
    <title>Вход | Панель Maestro</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/assets/images/brand/guitar-avatar.png">
    <link rel="apple-touch-icon" href="/assets/images/brand/guitar-avatar.png">

    <link rel="stylesheet" href="/css/styles.css?v=maestro1">
    <link rel="preload" href="/assets/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>


    <link rel="stylesheet" href="/css/maestro-brand.css?v=brand20261003">
</head>

<body class="crm-login">
    <main class="auth-page">
        <section class="auth-story" aria-label="Maestro — музыкальная школа">
            <div class="maestro-text-logo auth-wordmark">
                <img class="maestro-text-logo__img" src="/assets/images/brand/guitar-avatar.png" alt="" width="64" height="64">
                <span><span class="maestro-text-logo__title" translate="no">Maestro</span><span class="maestro-text-logo__subtitle">Музыкальная школа</span></span>
            </div>
            <div class="auth-story-copy"><p class="auth-eyebrow">Панель школы</p><h2>Всё, что помогает<br>музыке звучать.</h2><p>Ученики, уроки и дела школы —<br>в одном рабочем пространстве.</p></div>
            <img class="auth-guitar" src="/assets/images/brand/guitar.webp" width="440" height="800" alt="" aria-hidden="true">
            <span class="auth-story-footer">Maestro · Музыка начинается здесь</span>
        </section>

        <div class="auth-container">
            <div class="auth-header">
                <p class="auth-eyebrow">Добро пожаловать</p>
                <h1 class="auth-title">Вход в CRM</h1>
                <p class="auth-subtitle">Для администраторов и сотрудников школы</p>
            </div>

            <div class="error-message" id="errorMessage" role="alert"></div>

            <form class="auth-form" id="loginForm">
                <div class="auth-field">
                    <input type="tel" id="phone" name="phone" required placeholder=" " autocomplete="username" inputmode="tel">
                    <label for="phone">Телефон</label>
                </div>

                <div class="auth-field">
                    <input type="password" id="password" name="password" required placeholder=" " autocomplete="current-password">
                    <label for="password">Пароль</label>
                </div>

                <button type="submit" class="auth-submit">Войти</button>
            </form>

            <div class="auth-links">
                <a href="#" id="forgotPassword" style="color: var(--pink);">Забыли пароль?</a>
            </div>

            <div class="auth-contact">
                <p style="margin: 0;">Нет аккаунта?</p>
                <p id="noAccountContact" style="margin: 5px 0 0 0; color: var(--pink);">Обратитесь в школу Maestro</p>
            </div>
        </div>
    </main>

    <script src="/js/brand.js?v=brand20261003"></script>
    <script src="/js/config.js?v=8"></script>
    <!-- Main script is inlined in this file or handled by modules -->
    <script>
        // Форматирование телефона
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^\d+]/g, '');
            if (value.startsWith('8')) {
                value = '+7' + value.substring(1);
            } else if (value.length > 0 && !value.startsWith('+')) {
                value = '+' + value;
            }
            if (value.length > 0) {
                value = '+' + value.replace(/\+/g, '');
            }
            if (value.length > 16) {
                value = value.substring(0, 16);
            }
            e.target.value = value;
        });

        // Обработка формы входа
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Очищаем номер от лишних символов (оставляем только плюс и цифры)
            const rawPhone = document.getElementById('phone').value;
            const phone = rawPhone.replace(/[^\d+]/g, '');
            const password = document.getElementById('password').value;

            // Скрываем ошибку
            errorMessage.classList.remove('show');

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone, password })
                });

                // Проверяем, что ответ валидный
                if (!response.ok && response.status >= 500) {
                    throw new Error('Сервис временно недоступен. Попробуйте позже.');
                }

                // Проверяем, что ответ JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    await response.text().catch(() => '');
                    throw new Error('Не удалось выполнить вход. Попробуйте позже.');
                }

                const data = await response.json();

                if (response.ok && data.success) {
                    // Сохраняем токен и данные пользователя
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', data.user._id);
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userPhone', data.user.phone);
                    localStorage.setItem('userRole', data.user.role);

                    // Показываем уведомление
                    if (typeof showNotification !== 'undefined') {
                        showNotification(notificationWithIcon('party', 'Вход выполнен успешно!'));
                    }

                    // Перенаправляем в зависимости от роли
                    setTimeout(() => {
                        // Админка для: super_admin, admin, sales_manager, teacher
                        if (['super_admin', 'admin', 'sales_manager', 'teacher'].includes(data.user.role)) {
                            window.location.href = '/admin.html#schedule';
                        } else {
                            window.location.href = '/profile.html'; // Ученик → профиль
                        }
                    }, 500);
                } else {
                    // Показываем ошибку от сервера
                    errorMessage.textContent = data.error || 'Неверный телефон или пароль';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                console.error('Ошибка входа:', error);
                // Показываем понятное сообщение об ошибке
                if (error.message) {
                    errorMessage.textContent = error.message;
                } else if (error.name === 'SyntaxError' || error.message.includes('JSON')) {
                    errorMessage.textContent = 'Не удалось выполнить вход. Попробуйте позже.';
                } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    errorMessage.textContent = 'Не удалось выполнить вход. Проверьте интернет-соединение.';
                } else {
                    errorMessage.textContent = 'Не удалось выполнить вход. Попробуйте позже.';
                }
                errorMessage.classList.add('show');
            }
        });

        // Восстановление пароля
        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();

            const msg = typeof getMaestroSupportMessage === 'function'
                ? getMaestroSupportMessage()
                : 'Свяжитесь с администратором школы Maestro';
            if (typeof showNotification !== 'undefined') {
                showNotification(msg);
            } else {
                alert(msg);
            }
        });

        // Проверка - если уже залогинен, редиректим в зависимости от роли
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const userRole = localStorage.getItem('userRole');
        const token = localStorage.getItem('token');

        if (isLoggedIn && token && userRole) {
            // Админка для: super_admin, admin, sales_manager, teacher
            if (['super_admin', 'admin', 'sales_manager', 'teacher'].includes(userRole)) {
                window.location.href = '/admin.html#schedule';
            } else {
                // Ученик → профиль
                window.location.href = '/profile.html';
            }
        }

        const contactEl = document.getElementById('noAccountContact');
        if (contactEl) {
            const support = typeof getMaestroSupportText === 'function' ? getMaestroSupportText() : '';
            contactEl.textContent = support
                ? `Обратитесь в школу Maestro: ${support}`
                : 'Обратитесь в школу Maestro';
        }
    </script>
</body>

</html>
